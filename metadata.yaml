name: astrbot_plugin_memory_pod
desc: 鲸群记忆：索引式 Markdown 长期记忆与上下文压缩插件，无需 Embedding；自动历史版本与回收站、journal 日志按段折叠、共享人物空间、后台整理写入、搜索或模式与片段。
help: 装上即用。机器人通过 memory_read / memory_search / memory_note 使用记忆，记忆只由后台整理写入；上下文快满时自动摘要压缩。新增：覆盖/删除前自动保存历史，回收站可恢复；journal 日志不占单独索引行、不参与自动召回与查重；shared_people_bots 可让多个机器人共享人物记忆，并按 edit/append/read 控制写权限；memory_search 支持 any 与命中片段；日志按段续写并显示日期范围。窗口默认跟随 AstrBot；需要覆盖时可在插件配置中填写 max_context_tokens。管理页需要 AstrBot v4.24.1 及以上。管理员指令：/mb_status、/mb_reset、/mb_probe。
version: v1.6.0-dev.2
author: Sumire-dev0715
display_name: 鲸群记忆
short_desc: 让机器人记住人，跨会话、跨机器人共享，还能回溯和整理。
repo: https://github.com/Sumire-dev0715/astrbot_plugin_memory_pod
astrbot_version: ">=4.5.7"
tags:
  - 记忆
  - 长期记忆
  - 上下文压缩
  - 共享记忆
  - 历史版本
  - 日志
  - 记忆整理
